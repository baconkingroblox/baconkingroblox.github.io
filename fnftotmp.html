<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>FNF Atlas Converter</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #eee;
      padding: 20px;
    }

    input, button {
      margin: 8px 0;
    }

    canvas {
      margin-top: 10px;
      border: 1px solid #333;
      image-rendering: pixelated;
    }

    .row {
      margin-bottom: 10px;
    }
    
    .preview {
    width: 256px;
    height: auto;
    image-rendering: pixelated;
    border: 1px solid #333;
    margin-top: 8px;
  }

  .block {
    margin-bottom: 18px;
  }
  </style>
</head>
<body>

  <h2>FNF Spritesheet Converter</h2>

  <div class="row">
    PNG: <input type="file" id="pngInput" accept="image/png" />
  </div>

  <div class="row">
    XML: <input type="file" id="xmlInput" accept=".xml" />
  </div>

  <button onclick="process()">Convert</button>

  <div id="output"></div>

<script>
let atlasImage;
let xmlData;

const FRAME_W = 512;
const FRAME_H = 512;
const MAX_SIZE = 2048;

function parseXML(text) {
  const parser = new DOMParser();
  const xml = parser.parseFromString(text, "text/xml");

  const subs = [...xml.getElementsByTagName("SubTexture")];

  return subs.map(n => ({
    name: n.getAttribute("name"),
    x: parseInt(n.getAttribute("x")),
    y: parseInt(n.getAttribute("y")),
    w: parseInt(n.getAttribute("width")),
    h: parseInt(n.getAttribute("height"))
  }));
}

function cleanName(name) {
  name = name.toLowerCase();

  if (name.includes("idle")) return "idle";
  if (name.includes("note left")) return "left";
  if (name.includes("note right")) return "right";
  if (name.includes("note up")) return "up";
  if (name.includes("note down")) return "down";

  return name.replace(/\d+/g, "").replace(/\s/g, "_");
}

function loadImage(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.src = URL.createObjectURL(file);
  });
}

function crop(img, f, scale = 1) {
  const c = document.createElement("canvas");
  c.width = FRAME_W;
  c.height = FRAME_H;
  const ctx = c.getContext("2d");

  const destW = f.w * scale;
  const destH = f.h * scale;

  ctx.drawImage(
    img,
    f.x, f.y, f.w, f.h,
    (FRAME_W - destW) / 2, 
    FRAME_H - destH,       
    destW,
    destH
  );

  return c;
}

// ts cropped instead of downscaled. all gud now (hopefully)
function buildSheet(frames) {
    const frameCount = frames.length

    const cols = Math.ceil(Math.sqrt(frameCount))
    const rows = Math.ceil(frameCount / cols)

    let scale = 1

    while (
        cols * FRAME_W * scale > MAX_SIZE ||
        rows * FRAME_H * scale > MAX_SIZE
    ) {
        scale *= 0.95
    }

    const fw = Math.floor(FRAME_W * scale)
    const fh = Math.floor(FRAME_H * scale)

    const canvas = document.createElement("canvas")
    canvas.width = cols * fw
    canvas.height = rows * fh

    const ctx = canvas.getContext("2d")

    frames.forEach((f, i) => {
        const x = (i % cols) * fw
        const y = Math.floor(i / cols) * fh

        ctx.drawImage(
            f.canvas,
            0,
            0,
            FRAME_W,
            FRAME_H,
            x,
            y,
            fw,
            fh
        )
    })

    return {
        canvas,
        rows,
        cols,
        fw,
        fh
    }
}

async function process() {
  const pngFile = document.getElementById("pngInput").files[0];
  const xmlFile = document.getElementById("xmlInput").files[0];

  if (!pngFile || !xmlFile) return alert("missing files");

  atlasImage = await loadImage(pngFile);
  xmlData = await xmlFile.text();

  const frames = parseXML(xmlData);

  const groupedFrames = {};
  for (const f of frames) {
    const name = cleanName(f.name);
    if (!groupedFrames[name]) groupedFrames[name] = [];
    groupedFrames[name].push(f);
  }

  const grouped = {};
  for (const anim in groupedFrames) {
    const list = groupedFrames[anim];
    
    let maxW = 0;
    let maxH = 0;
    for (const f of list) {
      if (f.w > maxW) maxW = f.w;
      if (f.h > maxH) maxH = f.h;
    }
    
    const groupScale = Math.min(1, FRAME_W / maxW, FRAME_H / maxH);
    
    grouped[anim] = list.map(f => ({
      canvas: crop(atlasImage, f, groupScale)
    }));
  }

  const output = document.getElementById("output");
  output.innerHTML = "";

  const metadata = {};

  for (const anim in grouped) {
    const list = grouped[anim];
    const result = buildSheet(list)
    const img = result.canvas.toDataURL();
    
    const imgEl = document.createElement("img");
    imgEl.src = img;
    output.appendChild(document.createElement("br"));
    imgEl.className = "preview";

    const container = document.createElement("div");
    container.className = "block";

    container.appendChild(imgEl);
    output.appendChild(container);

    metadata[anim] = {
      sheet: anim + ".png",
      rows: result.rows,
      cols: result.cols,
      fps: 24,
      crop_w: result.fw,
      crop_h: result.fh
    };

    // download
    const a = document.createElement("a");
    a.href = img;
    a.download = anim + ".png";
    a.textContent = "download " + anim + ".png";
    output.appendChild(document.createElement("br"));
    output.appendChild(a);
  }

  const jsonBlob = new Blob(
    [JSON.stringify(metadata, null, 2)],
    { type: "application/json" }
  );

  const jsonUrl = URL.createObjectURL(jsonBlob);

  const j = document.createElement("a");
  j.href = jsonUrl;
  j.download = "metadata.json";
  j.textContent = "download json";

  output.appendChild(document.createElement("br"));
  output.appendChild(j);
}
</script>

</body>
</html>
